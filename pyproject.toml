[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PyZALO"
version = "0.1.0"
authors = [
    {name = "PhongVeChai", email = "aimabtdcdungko@gmail.com"},
]
description = "Python library for Zalo OA Bot - Tạo bot Zalo dễ dàng với Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["zalo", "bot", "oa", "chatbot", "automation", "zalo-oa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",

dependencies = [
    "requests>=2.28.0,<3.0.0",          # Gọi API HTTP
    "websocket-client>=1.4.0,<2.0.0",   # WebSocket cho realtime
    "Pillow>=9.0.0,<11.0.0",            # Xử lý ảnh
    "qrcode>=7.4.0,<8.0.0",             # Tạo QR code
    "python-dotenv>=1.0.0,<2.0.0",      # Quản lý biến môi trường
    "aiohttp>=3.8.0,<4.0.0",            # HTTP async
    "pydantic>=2.0.0,<3.0.0",           # Data validation
    "loguru>=0.7.0,<1.0.0",             # Logging đẹp
    "colorama>=0.4.6,<1.0.0",           # Màu sắc cho terminal (Windows)
    "python-dateutil>=2.8.0,<3.0.0",    # Xử lý thời gian
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",             # Testing
    "pytest-cov>=4.0.0,<6.0.0",         # Code coverage
    "black>=23.0.0,<25.0.0",            # Code formatter
    "flake8>=6.0.0,<8.0.0",             # Linter
    "mypy>=1.0.0,<2.0.0",               # Type checking
    "isort>=5.12.0,<6.0.0",             # Import sắp xếp
    "pre-commit>=3.0.0,<4.0.0",         # Git hooks
    "build>=1.0.0,<2.0.0",              # Build tool
    "twine>=4.0.0,<6.0.0",              # Upload to PyPI
    "ruff>=0.1.0,<1.0.0",               # Fast linter (thay thế flake8 + isort)
]

docs = [
    "mkdocs>=1.5.0,<2.0.0",             # Tài liệu
    "mkdocs-material>=9.0.0,<10.0.0",   # Theme đẹp
    "mkdocstrings>=0.24.0,<1.0.0",      # Auto doc từ docstring
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",           # Test async
    "pytest-mock>=3.10.0",              # Mock objects
    "responses>=0.25.0",                # Mock HTTP requests
]

all = [
    "PyZALO[dev]",
    "PyZALO[docs]",
    "PyZALO[test]",
]

[project.urls]
Homepage = "https://github.com/PhongNguyenxDEV/PyZALO"
Documentation = "https://bot.zaloplatforms.com/docs/"
Repository = "https://github.com/PhongNguyenxDEV/PyZALO"
Issues = "https://github.com/PhongNguyenxDEV/PyZALO/issues"
Changelog = "https://github.com/PhongNguyenxDEV/PyZALO/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["pyzalo"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=pyzalo --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["pyzalo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
]