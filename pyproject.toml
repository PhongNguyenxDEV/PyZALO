[build-system]
requires = ["hatchling"] 
build-backend = "hatchling.build"

[project]
name = "PyZALO"       
version = "0.1.0"
authors = [
  { name="PhongVeChai", email="aimabtdcdungko@gmail.com" },
]
description = "Một thư viện Python để tương tác với Zalo API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PhongNguyenxDEV/PyZALO"
Issues = "https://github.com/PhongNguyenxDEV/PyZALO/issues"